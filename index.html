<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト・給与自動計算 & 児童扶養手当予測カレンダー</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --text: #1e293b;
    --border: #e2e8f0;
    --bg: #f8fafc;
    --card: #ffffff;
    --allowance-color: #f59e0b;
    --event-color: #ec4899;
    --holiday-bg: #fff1f2;
    --jido-color: #7c3aed;
    --jido-bg: #f5f3ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg); color: var(--text); padding: 8px; max-width: 980px; margin: 0 auto; overflow-x: hidden; }
  
  /* サマリーカード */
  .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr)); gap: 6px; margin-bottom: 8px; }
  .card { background: var(--card); padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); box-shadow: 0 1px 2px rgba(0,0,0,0.03); display: flex; flex-direction: column; justify-content: space-between; }
  .card-title { font-size: 10px; color: #64748b; margin-bottom: 2px; font-weight: 500; }
  .card-val { font-size: 15px; font-weight: bold; }
  .card-sub { font-size: 9px; color: #64748b; margin-top: 2px; }
  .total-val { color: var(--primary); font-size: 18px; }

  /* 児童扶養手当パネル */
  .jido-panel { background: var(--jido-bg); border: 1px solid #ddd6fe; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .jido-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 4px; }
  .jido-title { font-size: 12px; font-weight: bold; color: var(--jido-color); display: flex; align-items: center; gap: 4px; }
  .jido-result { font-size: 14px; font-weight: bold; color: var(--jido-color); }
  .jido-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 4px; font-size: 10px; color: #4b5563; margin-top: 4px; border-top: 1px dashed #ddd6fe; padding-top: 4px; }

  /* コントロールバー */
  .ctrl-bar { display: flex; justify-content: space-between; align-items: center; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .month-nav { display: flex; align-items: center; gap: 4px; }
  .cal-title { font-size: 15px; font-weight: bold; min-width: 105px; text-align: center; }
  .btn { padding: 5px 8px; border: 1px solid var(--border); background: var(--card); border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 500; }
  .btn:hover { background: var(--primary-light); border-color: var(--primary); }
  .btn-primary { background: var(--primary); color: #fff; border: none; }
  .btn-primary:hover { background: #1d4ed8; color: #fff; }
  .btn-auto { border-color: #cbd5e1; background: #f1f5f9; color: #334155; }
  .btn-auto:hover { background: #e2e8f0; }

  /* カレンダーグリッド（7等分固定レイアウト） */
  .calendar-grid { 
    display: grid; 
    grid-template-columns: repeat(7, minmax(0, 1fr)); 
    gap: 3px; 
    background: var(--card); 
    padding: 6px; 
    border-radius: 10px; 
    border: 1px solid var(--border); 
    width: 100%;
  }
  .day-name { text-align: center; font-size: 11px; font-weight: bold; padding: 4px 0; color: #64748b; }
  .day-name.sat { color: #3b82f6; }
  .day-name.sun { color: #ef4444; }
  
  .day-cell { 
    min-height: 74px; 
    border: 1px solid var(--border); 
    border-radius: 6px; 
    padding: 3px 2px; 
    cursor: pointer; 
    background: #fff; 
    display: flex; 
    flex-direction: column; 
    justify-content: flex-start; 
    gap: 2px; 
    overflow: hidden; 
    width: 100%;
  }
  .day-cell:hover { border-color: var(--primary); }
  .day-cell.empty { background: #f8fafc; border: none; cursor: default; }
  .day-cell.holiday { background: var(--holiday-bg); }
  
  .day-top { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 1px; }
  .day-num { font-size: 11px; font-weight: bold; line-height: 1; }
  .day-cell.sat .day-num { color: #3b82f6; }
  .day-cell.sun .day-num, .day-cell.holiday .day-num { color: #ef4444; }
  
  .holiday-tag { 
    font-size: 8px; 
    color: #ef4444; 
    font-weight: normal; 
    overflow: hidden; 
    text-overflow: ellipsis; 
    white-space: nowrap; 
    line-height: 1; 
    max-width: 60%; 
    text-align: right; 
  }

  .badge-list { display: flex; flex-direction: column; gap: 2px; width: 100%; }
  .badge { 
    font-size: 9px; 
    padding: 1px 3px; 
    border-radius: 3px; 
    color: #fff; 
    font-weight: 500; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; 
    line-height: 1.2; 
    width: 100%; 
  }
  .badge-allowance { background: var(--allowance-color); }
  .badge-event { background: var(--event-color); }

  /* モーダル */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; z-index: 100; padding: 12px; }
  .modal-content { background: #fff; border-radius: 14px; padding: 16px; width: 100%; max-width: 440px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); max-height: 90vh; overflow-y: auto; }
  .modal-header { font-size: 15px; font-weight: bold; margin-bottom: 12px; }
  .form-group { margin-bottom: 10px; }
  .form-label { display: block; font-size: 11px; color: #64748b; margin-bottom: 3px; font-weight: 500; }
  .form-input { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
  .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; }
  
  .company-card { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
  .company-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
  .tier-box { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px; margin-top: 6px; }
</style>
</head>
<body>

<!-- サマリー（動的生成） -->
<div class="dashboard" id="dashboardContainer"></div>

<!-- 児童扶養手当シミュレーターパネル -->
<div class="jido-panel">
  <div class="jido-header">
    <span class="jido-title">🏛️ 児童扶養手当 予測 (姶良市基準 / 全収入連動)</span>
    <span class="jido-result" id="jidoMonthlyEstimate">計算中...</span>
  </div>
  <div class="jido-details">
    <div id="jidoAnnualSalary">年間給与見込: 0円</div>
    <div id="jidoAnnualChildSupport">年間養育費: 0円 (算入80%)</div>
    <div id="jidoCalculatedIncome">判定所得額: 0円</div>
    <div id="jidoStatus">支給区分: 判定中</div>
  </div>
</div>

<!-- コントロールバー -->
<div class="ctrl-bar">
  <div class="month-nav">
    <button class="btn" onclick="prevMonth()">◀</button>
    <div class="cal-title" id="monthTitle">2026年 9月</div>
    <button class="btn" onclick="nextMonth()">▶</button>
  </div>
  <div id="autoFillButtonsContainer" style="display:flex; gap:4px; flex-wrap: wrap;"></div>
  <div style="display:flex; gap:4px; flex-wrap: wrap; margin-left:auto;">
    <button class="btn" onclick="openCompanySettingsModal()">⚙ 会社・給与設定</button>
    <button class="btn" onclick="openJidoSettingsModal()">🏛️ 手当設定</button>
    <button class="btn" onclick="openDataModal()">💾 保存/復元</button>
  </div>
</div>

<!-- カレンダー枠 -->
<div class="calendar-grid" id="calendar">
  <div class="day-name">月</div><div class="day-name">火</div><div class="day-name">水</div>
  <div class="day-name">木</div><div class="day-name">金</div><div class="day-name sat">土</div><div class="day-name sun">日</div>
</div>

<!-- 日付設定モーダル -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header" id="modalDateTitle">日付設定</div>
    
    <div id="modalCompanyList"></div>

    <div class="form-group" style="border-top:1px dashed #cbd5e1; padding-top:8px;">
      <label class="form-label" style="color:var(--event-color);">大切な予定・メモ（重複防止）</label>
      <input type="text" id="eventNote" class="form-input" placeholder="例: 参観日、通院">
    </div>

    <div class="form-group">
      <label class="form-label">手当・養育費・その他入金額 (円)</label>
      <input type="number" id="allowanceAmt" class="form-input" placeholder="例: 40000" min="0" step="1000">
    </div>

    <div class="form-group">
      <label class="form-label">手当の名称（「養育費」を含むと手当算定に自動反映）</label>
      <input type="text" id="allowanceNote" class="form-input" placeholder="例: 養育費、児童手当">
    </div>

    <div class="form-group">
      <label class="checkbox-label" style="font-size:12px; color:#ef4444;">
        <input type="checkbox" id="isHolidayCheck">
        この日を祝日として扱う (背景薄赤)
      </label>
    </div>

    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveDayData()">保存</button>
    </div>
  </div>
</div>

<!-- 会社・給与設定モーダル -->
<div class="modal" id="companySettingsModal">
  <div class="modal-content" style="max-width:480px;">
    <div class="modal-header">⚙ 勤務先・給与設定</div>
    <div style="font-size:11px; color:#64748b; margin-bottom:10px;">
      勤務先名、正社員（固定給）またはパート（時給・交通費）、一括投入のON/OFF、昇給・改定履歴を管理できます。
    </div>

    <div id="companySettingsContainer"></div>

    <button class="btn btn-primary" type="button" onclick="addNewCompany()" style="width:100%; margin-bottom:12px;">＋ 新しい勤務先を追加</button>

    <div class="modal-actions">
      <button class="btn" onclick="closeCompanySettingsModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveCompanySettings()">保存</button>
    </div>
  </div>
</div>

<!-- 児童扶養手当設定モーダル -->
<div class="modal" id="jidoSettingsModal">
  <div class="modal-content">
    <div class="modal-header">🏛️ 児童扶養手当・所得控除設定</div>
    <div class="form-group">
      <label class="form-label">年間養育費の想定額 (円)</label>
      <input type="number" id="cfgAnnualChildSupport" class="form-input" placeholder="例: 480000">
      <span style="font-size:10px; color:#64748b;">※カレンダーに入力した養育費実績と大きい方が自動算入されます。</span>
    </div>
    <div class="form-group">
      <label class="form-label">扶養親族等の人数（子どもの人数）</label>
      <input type="number" id="cfgChildrenCount" class="form-input" min="1" max="5" value="1">
    </div>
    <div class="form-group">
      <label class="form-label">その他控除（医療費控除等があれば年額入力）</label>
      <input type="number" id="cfgOtherDeductions" class="form-input" placeholder="通常0でOK" value="0">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeJidoSettingsModal()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveJidoSettings()">保存</button>
    </div>
  </div>
</div>

<!-- データ管理モーダル -->
<div class="modal" id="dataModal">
  <div class="modal-content">
    <div class="modal-header">💾 データのバックアップと復元</div>
    <div class="form-group">
      <button class="btn btn-primary" style="width:100%; margin-bottom:8px;" onclick="exportDataToFile()">📥 バックアップ書き出し (保存)</button>
    </div>
    <div class="form-group" style="border-top:1px dashed #cbd5e1; padding-top:12px;">
      <label class="form-label">📤 バックアップファイルから復元</label>
      <input type="file" id="importFileInput" class="form-input" accept=".json" onchange="importDataFromFile(event)">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeDataModal()">閉じる</button>
    </div>
  </div>
</div>

<script>
  let currentYear = 2026;
  let currentMonth = 8; // 9月
  let selectedDateKey = null;

  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist();
  }

  // デフォルトの基本設定（会社配列管理）
  const DEFAULT_COMPANIES = [
    {
      id: "c1",
      name: "勤務先1",
      color: "#3b82f6",
      payType: "part", // "part" (時給) または "full" (月給)
      netRate: 83,
      autoWeekday: true,
      autoWeekend: false,
      defaultHours: 7,
      history: [
        { startYM: "2026-01", hourly: 1270, transit: 330, monthlySalary: 0, note: "旧単価" },
        { startYM: "2026-10", hourly: 1300, transit: 330, monthlySalary: 0, note: "10月昇給" }
      ]
    },
    {
      id: "c2",
      name: "勤務先2",
      color: "#10b981",
      payType: "part",
      netRate: 96,
      autoWeekday: false,
      autoWeekend: true,
      defaultHours: 3,
      history: [
        { startYM: "2026-01", hourly: 1370, transit: 0, monthlySalary: 0, note: "基本単価" }
      ]
    }
  ];

  let config = {
    childrenCount: 1,
    annualChildSupport: 480000,
    otherDeductions: 0,
    companies: JSON.parse(JSON.stringify(DEFAULT_COMPANIES))
  };

  let shiftData = {};

  // 保存データの安全な復旧と旧バージョンの自動マイグレーション
  try {
    const rawCfg = localStorage.getItem('shift_config');
    if (rawCfg) {
      const parsedCfg = JSON.parse(rawCfg);
      if (parsedCfg.companies && Array.isArray(parsedCfg.companies) && parsedCfg.companies.length > 0) {
        config = Object.assign(config, parsedCfg);
      } else {
        // 旧単価設定がある場合の引き継ぎ
        if (parsedCfg.makesDaily) {
          config.companies[0].history[0].hourly = Math.round((parsedCfg.makesDaily - 330) / 7);
        }
        if (parsedCfg.hHourly) {
          config.companies[1].history[0].hourly = parsedCfg.hHourly;
        }
      }
    }

    const rawData = localStorage.getItem('shift_data');
    if (rawData) {
      const parsedData = JSON.parse(rawData);
      // 古いキー（makes, hHours）を新フォーマット（companies）に完全変換
      for (const [k, v] of Object.entries(parsedData)) {
        if (!v.companies) {
          v.companies = {};
          if (v.makes) {
            v.companies["c1"] = { checked: true, hours: 7 };
          }
          if (v.hHours > 0) {
            v.companies["c2"] = { checked: true, hours: v.hHours };
          }
        }
      }
      shiftData = parsedData;
    }
  } catch(e) {
    console.warn("Data loading fallback", e);
  }

  // 会社・年月ごとの適用単価を取得
  function getAppliedRate(company, ymStr) {
    if (!company || !company.history || company.history.length === 0) {
      return { hourly: 1200, transit: 0, monthlySalary: 0, startYM: "2026-01" };
    }
    const targetYM = ymStr.slice(0, 7);
    const sorted = [...company.history].sort((a, b) => a.startYM.localeCompare(b.startYM));
    let applied = sorted[0];
    for (const h of sorted) {
      if (targetYM >= h.startYM) {
        applied = h;
      }
    }
    return applied;
  }

  const HOLIDAYS = {
    "2026-01-01": "元日", "2026-01-12": "成人の日", "2026-02-11": "建国記念", "2026-02-23": "天皇誕生日",
    "2026-03-20": "春分の日", "2026-04-29": "昭和の日", "2026-05-03": "憲法記念", "2026-05-04": "みどりの日",
    "2026-05-05": "こどもの日", "2026-05-06": "振替休日", "2026-07-20": "海の日", "2026-08-11": "山の日",
    "2026-09-21": "敬老の日", "2026-09-22": "国民休日", "2026-09-23": "秋分の日", "2026-10-12": "スポーツの日",
    "2026-11-03": "文化の日", "2026-11-23": "勤労感謝",
    "2027-01-01": "元日", "2027-01-11": "成人の日", "2027-02-11": "建国記念", "2027-02-23": "天皇誕生日"
  };

  function persistData() {
    try {
      localStorage.setItem('shift_data', JSON.stringify(shiftData));
      localStorage.setItem('shift_config', JSON.stringify(config));
    } catch(e) {
      alert("保存に失敗しました。");
    }
  }

  function init() {
    renderControls();
    renderCalendar();
    updateSummary();
    calculateJidoAllowance();
  }

  function renderControls() {
    const container = document.getElementById('autoFillButtonsContainer');
    if (!container) return;
    container.innerHTML = '';

    config.companies.forEach(comp => {
      if (comp.autoWeekday) {
        const btn = document.createElement('button');
        btn.className = 'btn btn-auto';
        btn.innerText = `⚡ ${comp.name} 平日一括`;
        btn.onclick = () => autoFill(comp.id, 'weekday');
        container.appendChild(btn);
      }
      if (comp.autoWeekend) {
        const btn = document.createElement('button');
        btn.className = 'btn btn-auto';
        btn.innerText = `⚡ ${comp.name} 土日一括`;
        btn.onclick = () => autoFill(comp.id, 'weekend');
        container.appendChild(btn);
      }
    });
  }

  function renderCalendar() {
    const titleEl = document.getElementById('monthTitle');
    if (titleEl) titleEl.innerText = `${currentYear}年 ${currentMonth + 1}月`;
    const cal = document.getElementById('calendar');
    if (!cal) return;
    
    const cells = cal.querySelectorAll('.day-cell');
    cells.forEach(c => c.remove());

    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const offset = (firstDay + 6) % 7;
    const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 0; i < offset; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      cal.appendChild(empty);
    }

    for (let d = 1; d <= lastDate; d++) {
      const cell = document.createElement('div');
      const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dayOfWeek = new Date(currentYear, currentMonth, d).getDay();
      
      const isAutoHoliday = !!HOLIDAYS[dateKey];
      const data = shiftData[dateKey];
      const isCustomHoliday = data && data.isHoliday !== undefined ? data.isHoliday : isAutoHoliday;

      let classList = ['day-cell'];
      if (dayOfWeek === 6) classList.push('sat');
      if (dayOfWeek === 0) classList.push('sun');
      if (isCustomHoliday) classList.push('holiday');
      cell.className = classList.join(' ');
      cell.onclick = () => openModal(dateKey, d, isAutoHoliday);

      const dayTop = document.createElement('div');
      dayTop.className = 'day-top';

      const dayNum = document.createElement('div');
      dayNum.className = 'day-num';
      dayNum.innerText = d;
      dayTop.appendChild(dayNum);

      if (isAutoHoliday) {
        const holiTag = document.createElement('div');
        holiTag.className = 'holiday-tag';
        holiTag.innerText = HOLIDAYS[dateKey];
        dayTop.appendChild(holiTag);
      }
      cell.appendChild(dayTop);

      const badgeList = document.createElement('div');
      badgeList.className = 'badge-list';

      if (data) {
        if (data.event) {
          const b = document.createElement('div');
          b.className = 'badge badge-event';
          b.innerText = data.event;
          badgeList.appendChild(b);
        }
        if (data.companies) {
          config.companies.forEach(comp => {
            const cData = data.companies[comp.id];
            if (cData && cData.checked) {
              const b = document.createElement('div');
              b.className = 'badge';
              b.style.backgroundColor = comp.color || '#3b82f6';
              if (comp.payType === 'full') {
                b.innerText = comp.name;
              } else {
                b.innerText = `${comp.name} ${cData.hours !== undefined ? cData.hours : (comp.defaultHours || 0)}h`;
              }
              badgeList.appendChild(b);
            }
          });
        }
        if (data.allowance > 0) {
          const b = document.createElement('div');
          b.className = 'badge badge-allowance';
          b.innerText = data.allowanceNote ? `${data.allowanceNote}` : `+${data.allowance.toLocaleString()}`;
          badgeList.appendChild(b);
        }
      }

      cell.appendChild(badgeList);
      cal.appendChild(cell);
    }
  }

  function openModal(dateKey, day, isAutoHoliday) {
    selectedDateKey = dateKey;
    document.getElementById('modalDateTitle').innerText = `${currentMonth + 1}月 ${day}日の設定`;
    
    const data = shiftData[dateKey] || { companies: {} };
    const compContainer = document.getElementById('modalCompanyList');
    compContainer.innerHTML = '';

    config.companies.forEach(comp => {
      const cData = (data.companies && data.companies[comp.id]) ? data.companies[comp.id] : {};
      const rate = getAppliedRate(comp, dateKey);

      const box = document.createElement('div');
      box.className = 'form-group';
      box.style.background = '#f8fafc';
      box.style.border = '1px solid #e2e8f0';
      box.style.borderRadius = '8px';
      box.style.padding = '8px';

      let rateText = "";
      if (comp.payType === 'full') {
        rateText = `月給: ${rate.monthlySalary.toLocaleString()}円`;
      } else {
        const dailyEstimate = (rate.hourly * (comp.defaultHours || 0)) + (rate.transit || 0);
        rateText = `時給: ${rate.hourly.toLocaleString()}円 / 交通費: ${rate.transit.toLocaleString()}円 (日当換算 約${dailyEstimate.toLocaleString()}円)`;
      }

      box.innerHTML = `
        <label class="checkbox-label" style="font-weight:600;">
          <input type="checkbox" id="modal_comp_check_${comp.id}" ${cData.checked ? 'checked' : ''} style="width:16px;height:16px;">
          <span style="color:${comp.color || '#1e293b'}">${comp.name} 出勤</span>
        </label>
        <div style="font-size:10px; color:#64748b; margin:2px 0 6px 22px;">${rateText}</div>
        ${comp.payType === 'part' ? `
          <div style="display:flex; align-items:center; gap:6px; margin-left:22px;">
            <span style="font-size:11px; color:#475569;">勤務時間:</span>
            <input type="number" id="modal_comp_hours_${comp.id}" class="form-input" style="width:80px; padding:4px 6px;" value="${cData.hours !== undefined ? cData.hours : (comp.defaultHours || 0)}" min="0" step="0.5">
            <span style="font-size:11px; color:#475569;">時間</span>
          </div>
        ` : ''}
      `;
      compContainer.appendChild(box);
    });

    document.getElementById('eventNote').value = data.event || '';
    document.getElementById('allowanceAmt').value = data.allowance || '';
    document.getElementById('allowanceNote').value = data.allowanceNote || '';
    document.getElementById('isHolidayCheck').checked = data.isHoliday !== undefined ? data.isHoliday : isAutoHoliday;

    document.getElementById('modal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('modal').style.display = 'none';
  }

  function saveDayData() {
    const companiesData = {};
    let hasCompanyChecked = false;

    config.companies.forEach(comp => {
      const chk = document.getElementById(`modal_comp_check_${comp.id}`);
      const hoursEl = document.getElementById(`modal_comp_hours_${comp.id}`);
      const isChecked = chk ? chk.checked : false;
      const hours = hoursEl ? parseFloat(hoursEl.value) || 0 : 0;

      if (isChecked) {
        hasCompanyChecked = true;
        companiesData[comp.id] = { checked: true, hours: hours };
      }
    });

    const event = document.getElementById('eventNote').value.trim();
    const allowance = parseInt(document.getElementById('allowanceAmt').value, 10) || 0;
    const allowanceNote = document.getElementById('allowanceNote').value.trim();
    const isHoliday = document.getElementById('isHolidayCheck').checked;

    if (!hasCompanyChecked && allowance === 0 && !allowanceNote && !event && !isHoliday) {
      delete shiftData[selectedDateKey];
    } else {
      shiftData[selectedDateKey] = {
        companies: companiesData,
        event, allowance, allowanceNote, isHoliday
      };
    }

    persistData();
    closeModal();
    renderCalendar();
    updateSummary();
    calculateJidoAllowance();
  }

  function autoFill(compId, targetType) {
    const comp = config.companies.find(c => c.id === compId);
    if (!comp) return;

    const label = targetType === 'weekday' ? '平日（月〜金・祝日除く）' : '土曜日・日曜日';
    if (!confirm(`${currentMonth + 1}月の${label}に「${comp.name}」を一括入力しますか？`)) return;

    const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
    for (let d = 1; d <= lastDate; d++) {
      const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const dayOfWeek = new Date(currentYear, currentMonth, d).getDay();
      const isHoliday = !!HOLIDAYS[dateKey];

      let match = false;
      if (targetType === 'weekday') {
        match = (dayOfWeek !== 0 && dayOfWeek !== 6 && !isHoliday);
      } else {
        match = (dayOfWeek === 0 || dayOfWeek === 6);
      }

      if (match) {
        if (!shiftData[dateKey]) shiftData[dateKey] = { companies: {} };
        if (!shiftData[dateKey].companies) shiftData[dateKey].companies = {};
        
        shiftData[dateKey].companies[comp.id] = {
          checked: true,
          hours: comp.defaultHours || 0
        };
      }
    }

    persistData();
    renderCalendar();
    updateSummary();
    calculateJidoAllowance();
  }

  function updateSummary() {
    const currentYM = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
    let allowanceTotal = 0;
    const compSummary = {};

    config.companies.forEach(c => {
      compSummary[c.id] = {
        name: c.name,
        color: c.color,
        days: 0,
        totalHours: 0,
        gross: 0,
        net: 0,
        rate: getAppliedRate(c, currentYM),
        payType: c.payType
      };
    });

    for (const [key, val] of Object.entries(shiftData)) {
      if (key.startsWith(currentYM)) {
        if (val.allowance) allowanceTotal += val.allowance;
        if (val.companies) {
          config.companies.forEach(comp => {
            const cd = val.companies[comp.id];
            if (cd && cd.checked) {
              compSummary[comp.id].days++;
              const h = (cd.hours !== undefined) ? cd.hours : (comp.defaultHours || 0);
              compSummary[comp.id].totalHours += h;
              
              if (comp.payType === 'part') {
                const r = compSummary[comp.id].rate;
                compSummary[comp.id].gross += (r.hourly * h) + (r.transit || 0);
              }
            }
          });
        }
      }
    }

    let overallNet = allowanceTotal;
    const container = document.getElementById('dashboardContainer');
    if (!container) return;
    container.innerHTML = '';

    const totalCard = document.createElement('div');
    totalCard.className = 'card';
    totalCard.innerHTML = `
      <div class="card-title">当月 実入金手取り</div>
      <div class="card-val total-val" id="totalNetVal">0円</div>
      <div class="card-sub">給料＋手当 合算</div>
    `;
    container.appendChild(totalCard);

    config.companies.forEach(comp => {
      const sum = compSummary[comp.id];
      if (comp.payType === 'full') {
        sum.gross = sum.days > 0 ? sum.rate.monthlySalary : 0;
      }
      sum.net = Math.round(sum.gross * ((comp.netRate || 100) / 100));
      overallNet += sum.net;

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-title" style="color:${comp.color || '#334155'}; font-weight:bold;">${comp.name} 手取り</div>
        <div class="card-val">${sum.net.toLocaleString()}円</div>
        <div class="card-sub">${comp.payType === 'full' ? `出勤: ${sum.days}日 (総額: ${sum.gross.toLocaleString()}円)` : `出勤: ${sum.days}日 / ${sum.totalHours}h (総額: ${sum.gross.toLocaleString()}円)`}</div>
      `;
      container.appendChild(card);
    });

    const allCard = document.createElement('div');
    allCard.className = 'card';
    allCard.innerHTML = `
      <div class="card-title">手当・養育費</div>
      <div class="card-val">${allowanceTotal.toLocaleString()}円</div>
      <div class="card-sub">児童手当・養育費など</div>
    `;
    container.appendChild(allCard);

    const totalNetEl = document.getElementById('totalNetVal');
    if (totalNetEl) totalNetEl.innerText = `${overallNet.toLocaleString()}円`;
  }

  function getEmploymentIncomeDeduction(gross) {
    if (gross <= 550000) return gross;
    if (gross <= 1625000) return 550000;
    if (gross <= 1800000) return Math.floor(gross * 0.4) - 100000;
    if (gross <= 3600000) return Math.floor(gross * 0.3) + 80000;
    if (gross <= 6600000) return Math.floor(gross * 0.2) + 440000;
    if (gross <= 8500000) return Math.floor(gross * 0.1) + 1100000;
    return 1950000;
  }

  function calculateJidoAllowance() {
    let calendarSalary = 0;
    let calendarChildSupport = 0;
    const yearPrefix = `${currentYear}-`;

    for (const [key, val] of Object.entries(shiftData)) {
      if (key.startsWith(yearPrefix)) {
        if (val.companies) {
          config.companies.forEach(comp => {
            const cd = val.companies[comp.id];
            if (cd && cd.checked) {
              const rate = getAppliedRate(comp, key);
              if (comp.payType === 'part') {
                const h = (cd.hours !== undefined) ? cd.hours : (comp.defaultHours || 0);
                calendarSalary += (rate.hourly * h) + (rate.transit || 0);
              }
            }
          });
        }
        if (val.allowance && val.allowanceNote && val.allowanceNote.includes("養育")) {
          calendarChildSupport += val.allowance;
        }
      }
    }

    config.companies.filter(c => c.payType === 'full').forEach(comp => {
      for (let m = 1; m <= 12; m++) {
        const ym = `${currentYear}-${String(m).padStart(2, '0')}`;
        const hasWorked = Object.keys(shiftData).some(k => k.startsWith(ym) && shiftData[k].companies && shiftData[k].companies[comp.id] && shiftData[k].companies[comp.id].checked);
        if (hasWorked) {
          const rate = getAppliedRate(comp, ym);
          calendarSalary += rate.monthlySalary;
        }
      }
    });

    const annualGrossSalary = calendarSalary;
    const employmentDeduction = getEmploymentIncomeDeduction(annualGrossSalary);
    const salaryIncome = Math.max(0, annualGrossSalary - employmentDeduction);

    const annualChildSupport = Math.max(calendarChildSupport, config.annualChildSupport || 480000);
    const childSupportAdded = Math.round(annualChildSupport * 0.80);

    const calculatedIncome = Math.max(0, salaryIncome + childSupportAdded - 80000 - (config.otherDeductions || 0));

    const limitFull = 870000 + (config.childrenCount - 1) * 380000;
    const limitPartial = 2300000 + (config.childrenCount - 1) * 380000;

    const baseFullAmt = 45500;
    let monthlyEstimate = 0;
    let statusText = "";

    if (calculatedIncome <= limitFull) {
      monthlyEstimate = baseFullAmt;
      statusText = "全部支給";
    } else if (calculatedIncome < limitPartial) {
      const deductionFromFull = (calculatedIncome - limitFull) * 0.0243007;
      monthlyEstimate = Math.max(10740, Math.round((45490 - deductionFromFull) / 10) * 10);
      statusText = "一部支給";
    } else {
      monthlyEstimate = 0;
      statusText = "支給停止（上限超過）";
    }

    const jidoMonthlyEl = document.getElementById('jidoMonthlyEstimate');
    if (jidoMonthlyEl) {
      jidoMonthlyEl.innerText = monthlyEstimate > 0 ? `${statusText}  約 ${monthlyEstimate.toLocaleString()}円 / 月` : statusText;
      document.getElementById('jidoAnnualSalary').innerText = `年間給与見込: 約 ${Math.round(annualGrossSalary).toLocaleString()}円`;
      document.getElementById('jidoAnnualChildSupport').innerText = `年間養育費: ${annualChildSupport.toLocaleString()}円 (算入: ${childSupportAdded.toLocaleString()}円)`;
      document.getElementById('jidoCalculatedIncome').innerText = `判定所得額: ${calculatedIncome.toLocaleString()}円`;
      document.getElementById('jidoStatus').innerText = `区分: ${statusText}`;
    }
  }

  function renderCompanySettingsUI() {
    const container = document.getElementById('companySettingsContainer');
    if (!container) return;
    container.innerHTML = '';

    config.companies.forEach((comp, cIdx) => {
      const card = document.createElement('div');
      card.className = 'company-card';

      let tiersHtml = '';
      comp.history.sort((a, b) => a.startYM.localeCompare(b.startYM)).forEach((tier, tIdx) => {
        tiersHtml += `
          <div class="tier-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <span style="font-size:11px; font-weight:bold;">適用開始年月: 
                <input type="month" class="form-input" style="width:auto; padding:2px 4px; display:inline-block; font-size:11px;" value="${tier.startYM}" onchange="updateCompTier(${cIdx}, ${tIdx}, 'startYM', this.value)">
              </span>
              ${comp.history.length > 1 ? `<button class="btn" style="padding:1px 5px; font-size:9px; color:#ef4444;" onclick="deleteCompTier(${cIdx},${tIdx})">削除</button>` : ''}
            </div>
            ${comp.payType === 'part' ? `
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
                <div>
                  <label class="form-label">時給 (円)</label>
                  <input type="number" class="form-input" value="${tier.hourly || 0}" onchange="updateCompTier(${cIdx},${tIdx}, 'hourly', this.value)">
                </div>
                <div>
                  <label class="form-label">交通費日額 (円)</label>
                  <input type="number" class="form-input" value="${tier.transit || 0}" onchange="updateCompTier(${cIdx},${tIdx}, 'transit', this.value)">
                </div>
              </div>
            ` : `
              <div>
                <label class="form-label">月額固定給（基本給＋手当 / 円）</label>
                <input type="number" class="form-input" value="${tier.monthlySalary || 0}" onchange="updateCompTier(${cIdx},${tIdx}, 'monthlySalary', this.value)">
              </div>
            `}
          </div>
        `;
      });

      card.innerHTML = `
        <div class="company-card-header">
          <input type="text" class="form-input" style="font-weight:bold; width:65%; font-size:13px;" value="${comp.name}" placeholder="会社名" onchange="updateCompField(${cIdx}, 'name', this.value)">
          ${config.companies.length > 1 ? `<button class="btn" style="padding:2px 6px; font-size:10px; color:#ef4444;" onclick="deleteCompany(${cIdx})">削除</button>` : ''}
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px;">
          <div>
            <label class="form-label">給与形態</label>
            <select class="form-input" onchange="updateCompField(${cIdx}, 'payType', this.value)">
              <option value="part" ${comp.payType === 'part' ? 'selected' : ''}>パート・アルバイト (時給)</option>
              <option value="full" ${comp.payType === 'full' ? 'selected' : ''}>正社員 (固定月給)</option>
            </select>
          </div>
          <div>
            <label class="form-label">手取り率目安 (%)</label>
            <input type="number" class="form-input" value="${comp.netRate || 100}" onchange="updateCompField(${cIdx}, 'netRate', this.value)">
          </div>
        </div>

        ${comp.payType === 'part' ? `
          <div class="form-group">
            <label class="form-label">標準勤務時間 (時間/日)</label>
            <input type="number" class="form-input" value="${comp.defaultHours \vert{}\vert{} 0}" step="0.5" onchange="updateCompField(${cIdx}, 'defaultHours', this.value)">
          </div>
        ` : ''}

        <div style="background:#fff; border:1px solid #e2e8f0; border-radius:6px; padding:6px; margin-bottom:8px;">
          <div style="font-size:10.5px; font-weight:bold; color:#475569; margin-bottom:4px;">一括投入ボタンの表示設定</div>
          <div style="display:flex; gap:12px;">
            <label class="checkbox-label" style="font-size:11px;">
              <input type="checkbox" ${comp.autoWeekday ? 'checked' : ''} onchange="updateCompField(${cIdx}, 'autoWeekday', this.checked)">
              平日一括を有効
            </label>
            <label class="checkbox-label" style="font-size:11px;">
              <input type="checkbox" ${comp.autoWeekend ? 'checked' : ''} onchange="updateCompField(${cIdx}, 'autoWeekend', this.checked)">
              土日一括を有効
            </label>
          </div>
        </div>

        <div style="margin-top:8px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:11px; font-weight:bold; color:var(--primary);">■ 昇給・改定履歴</span>
            <button class="btn btn-primary" style="padding:2px 6px; font-size:9px;" onclick="addCompTier(${cIdx})">＋ 改定・昇給を追加</button>
          </div>
          ${tiersHtml}
        </div>
      `;
      container.appendChild(card);
    });
  }

  function updateCompField(cIdx, field, val) {
    if (field === 'netRate' || field === 'defaultHours') {
      config.companies[cIdx][field] = parseFloat(val) || 0;
    } else {
      config.companies[cIdx][field] = val;
    }
    renderCompanySettingsUI();
  }

  function updateCompTier(cIdx, tIdx, field, val) {
    if (field === 'hourly' || field === 'transit' || field === 'monthlySalary') {
      config.companies[cIdx].history[tIdx][field] = parseInt(val, 10) || 0;
    } else {
      config.companies[cIdx].history[tIdx][field] = val;
    }
  }

  function addCompTier(cIdx) {
    const comp = config.companies[cIdx];
    const lastTier = comp.history[comp.history.length - 1] || { hourly: 1200, transit: 0, monthlySalary: 200000 };
    comp.history.push({
      startYM: "2026-10",
      hourly: lastTier.hourly || 0,
      transit: lastTier.transit || 0,
      monthlySalary: lastTier.monthlySalary || 0,
      note: "改定"
    });
    renderCompanySettingsUI();
  }

  function deleteCompTier(cIdx, tIdx) {
    if (config.companies[cIdx].history.length <= 1) return;
    config.companies[cIdx].history.splice(tIdx, 1);
    renderCompanySettingsUI();
  }

  function addNewCompany() {
    const colors = ["#3b82f6", "#10b981", "#f59e0b", "#ec4899", "#8b5cf6"];
    const newId = "c_" + Date.now();
    config.companies.push({
      id: newId,
      name: `勤務先 ${config.companies.length + 1}`,
      color: colors[config.companies.length % colors.length],
      payType: "part",
      netRate: 85,
      autoWeekday: true,
      autoWeekend: false,
      defaultHours: 7,
      history: [
        { startYM: "2026-01", hourly: 1200, transit: 0, monthlySalary: 0, note: "初期設定" }
      ]
    });
    renderCompanySettingsUI();
  }

  function deleteCompany(cIdx) {
    if (config.companies.length <= 1) {
      alert("勤務先は最低1つ必要です。");
      return;
    }
    if (confirm(`「${config.companies[cIdx].name}」を削除しますか？`)) {
      config.companies.splice(cIdx, 1);
      renderCompanySettingsUI();
    }
  }

  function openCompanySettingsModal() {
    renderCompanySettingsUI();
    document.getElementById('companySettingsModal').style.display = 'flex';
  }
  function closeCompanySettingsModal() {
    document.getElementById('companySettingsModal').style.display = 'none';
  }

  function saveCompanySettings() {
    persistData();
    closeCompanySettingsModal();
    renderControls();
    renderCalendar();
    updateSummary();
    calculateJidoAllowance();
    alert('勤務先・給与設定を保存しました');
  }

  function openJidoSettingsModal() {
    document.getElementById('cfgAnnualChildSupport').value = config.annualChildSupport || 480000;
    document.getElementById('cfgChildrenCount').value = config.childrenCount || 1;
    document.getElementById('cfgOtherDeductions').value = config.otherDeductions || 0;
    document.getElementById('jidoSettingsModal').style.display = 'flex';
  }
  function closeJidoSettingsModal() { document.getElementById('jidoSettingsModal').style.display = 'none'; }
  function saveJidoSettings() {
    config.annualChildSupport = parseInt(document.getElementById('cfgAnnualChildSupport').value, 10) || 480000;
    config.childrenCount = parseInt(document.getElementById('cfgChildrenCount').value, 10) || 1;
    config.otherDeductions = parseInt(document.getElementById('cfgOtherDeductions').value, 10) || 0;
    persistData();
    closeJidoSettingsModal();
    calculateJidoAllowance();
    alert('手当設定を更新しました');
  }

  function openDataModal() { document.getElementById('dataModal').style.display = 'flex'; }
  function closeDataModal() { document.getElementById('dataModal').style.display = 'none'; }

  function exportDataToFile() {
    const payload = {
      version: 8,
      shiftData: shiftData,
      config: config
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `shift_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importDataFromFile(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed.shiftData) {
          shiftData = parsed.shiftData;
          if (parsed.config) config = Object.assign(config, parsed.config);
          persistData();
          renderControls();
          renderCalendar();
          updateSummary();
          calculateJidoAllowance();
          alert('バックアップデータを正常に復元しました！');
          closeDataModal();
        }
      } catch(err) {
        alert('ファイルの読み込みに失敗しました。');
      }
    };
    reader.readAsText(file);
  }

  function prevMonth() {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    renderCalendar();
    updateSummary();
  }

  function nextMonth() {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
    updateSummary();
  }

  // 起動実行
  init();
</script>
